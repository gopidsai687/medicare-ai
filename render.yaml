services:
  - type: web
    name: medicare-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt aiosqlite email-validator"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS_RAW
        value: "http://localhost:5173,https://*.vercel.app"
